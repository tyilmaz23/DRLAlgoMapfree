    <text x="340" y="348" font-family="Arial, sans-serif" font-size="24" fill="#111827" font-weight="700">Real robot</text>
    <text x="0" y="435" font-family="Arial, sans-serif" font-size="19" fill="#475569">IEEE Access, 2026</text>
    <text x="0" y="465" font-family="Arial, sans-serif" font-size="19" fill="#475569">DOI: 10.1109/ACCESS.2026.3684520</text>
