      <text x="22" y="35" font-family="Arial, sans-serif" font-size="22" fill="#075985">PPO, SAC, A2C, TD3, DDPG</text>
      <rect x="0" y="82" width="360" height="54" rx="6" fill="#ecfdf5" stroke="#059669"/>
      <text x="22" y="117" font-family="Arial, sans-serif" font-size="22" fill="#065f46">Stable-Baselines3 pipeline</text>
      <rect x="0" y="164" width="360" height="54" rx="6" fill="#fff7ed" stroke="#ea580c"/>
      <text x="22" y="199" font-family="Arial, sans-serif" font-size="22" fill="#9a3412">TurtleBot3 and Gazebo notes</text>
